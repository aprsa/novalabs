[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novalabs"
version = "0.2.0"
description = "NovaLabs - Interactive astronomy lab platform for education"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Andrej Prša", email = "aprsa@villanova.edu"},
]
maintainers = [
    {name = "Andrej Prša", email = "aprsa@villanova.edu"},
]
keywords = [
    "astronomy",
    "education",
    "lab-management",
    "fastapi",
    "nicegui",
    "learning-management",
    "interactive-labs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "tortoise-orm>=0.20.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "toml>=0.10.2",
    "nicegui>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
all = [
    "novalabs[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/aprsa/novalabs"
Repository = "https://github.com/aprsa/novalabs"
Documentation = "https://github.com/aprsa/novalabs/blob/main/README.md"
"Bug Tracker" = "https://github.com/aprsa/novalabs/issues"

[project.scripts]
# Database management
novalabs-initdb = "scripts.initdb:main"
novalabs-loadlabs = "scripts.loadlabs:main"

# Lab management
novalabs-add-lab = "scripts.add_lab:main"

# User management
novalabs-createadmin = "scripts.createadmin:main"
novalabs-createuser = "scripts.createuser:main"

# Hub server
novalabs-hub = "novalabs.hub.main:main"

# UI server
novalabs-ui = "novalabs.ui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["novalabs"]

[tool.hatch.build.targets.sdist]
include = [
    "/novalabs",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["novalabs"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/scripts/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "tortoise.*",
    "nicegui.*",
    "jose.*",
]
ignore_missing_imports = true
